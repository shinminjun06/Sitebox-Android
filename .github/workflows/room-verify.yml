name: Verify photographic student room
on:
  push:
    branches: [ci/student-room-20261023]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sitebox-student-room-qa
  cancel-in-progress: true
jobs:
  room-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK and artwork validation tools
        timeout-minutes: 6
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]; then
            timeout 90s bash -c 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null' || true
            timeout 180s "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          fi
          python3 -m pip install Pillow
          command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Verify photo assets, geometry, unit tests and Android builds
        run: |
          sh tests/run.sh
          gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --no-daemon --console=plain
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Exercise the actual app on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb shell wm size 720x1560
            adb shell wm density 320
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            timeout 1200s adb shell am instrument -w com.sitebox.app.test/com.sitebox.app.SmokeInstrumentation | tee room-device-tests.txt
            mkdir -p room-device-qa
            adb pull /sdcard/Android/data/com.sitebox.app/files/qa/ room-device-qa/
            adb logcat -d -s AndroidRuntime:E > room-device-qa/crashes.txt
            adb shell dumpsys gfxinfo com.sitebox.app framestats > room-device-qa/emulator-frame-stats.txt
            grep -q 'PASS all nine theme combinations rendered' room-device-tests.txt
            grep -q 'PASS automatic sync merges, deletions, conflicts, account persistence and automatic restore verified' room-device-tests.txt
            grep -q 'PASS study live ambient and decoder lifecycle verified' room-device-tests.txt
            grep -q 'PASS photographic room reverse continuity, repeated requests and native Back verified' room-device-tests.txt
            ! grep -q 'FAIL ' room-device-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SiteBox-student-room-qa
          path: |
            room-device-tests.txt
            room-device-qa/
            app/build/reports/room-experience/
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest/
          retention-days: 30
          if-no-files-found: warn
