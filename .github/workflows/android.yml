name: Build SiteBox APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: sitebox-android-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      SITEBOX_DEBUG_KEYSTORE: ${{ github.workspace }}/.signing/sitebox-debug.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: FedericoCarboni/setup-ffmpeg@36c6454b5a2348e7794ba2d82a21506605921e3d # v3
        timeout-minutes: 6
        with:
          ffmpeg-version: release
      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]; then
            timeout 90s bash -c 'yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null' || true
            timeout 180s "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Verify library rules and bundled artwork
        run: |
          python3 -m pip install --user Pillow
          ffprobe -version
          sh tests/run.sh
      - name: Keep debug update signing stable across builds
        uses: actions/cache@v4
        with:
          path: .signing/sitebox-debug.keystore
          key: sitebox-debug-signing-v2
      - name: Create debug signing key only when the cache is empty
        run: |
          mkdir -p .signing
          if [ ! -f "$SITEBOX_DEBUG_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$SITEBOX_DEBUG_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assemblePreview :app:assembleDebugAndroidTest :app:lintDebug --no-daemon
      - name: Record provenance
        run: |
          echo "$GITHUB_SHA" > app/build/outputs/apk/debug/SOURCE_COMMIT.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/preview/app-preview.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - name: Enable hardware acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Run Android device QA and capture actual app screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb shell wm size 720x1560
            adb shell wm density 320
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            timeout 1200s adb shell am instrument -w com.sitebox.app.test/com.sitebox.app.SmokeInstrumentation | tee device-tests.txt
            mkdir -p device-qa
            adb pull /sdcard/Android/data/com.sitebox.app/files/qa/ device-qa/
            adb logcat -d -s AndroidRuntime:E > device-qa/crashes.txt
            adb logcat -d -s MediaPlayer:V NuPlayer:V CCodec:V ACodec:V TextureView:V > device-qa/media.txt
            grep -q 'PASS all nine theme combinations rendered' device-tests.txt
            grep -q 'PASS automatic sync merges, deletions, conflicts, account persistence and automatic restore verified' device-tests.txt
            grep -q 'PASS Google backup codec and local restore verified' device-tests.txt
            test -s device-qa/qa/backup-settings.png
            test -s device-qa/qa/backup-preview.png
            grep -q 'PASS study live ambient and decoder lifecycle verified' device-tests.txt
            for scene in day night rain snow; do test -s "device-qa/qa/ambient-$scene.png"; done
            ! grep -q 'FAIL ' device-tests.txt
            adb install -r app/build/outputs/apk/preview/app-preview.apk
            adb shell pm path com.sitebox.app.preview | grep 'package:'
            adb shell am start -n com.sitebox.app.preview/com.sitebox.app.MainActivity
            sleep 2
            adb exec-out screencap -p > device-qa/preview-installed.png
            adb shell screenrecord --time-limit 6 /sdcard/sitebox-live.mp4
            adb pull /sdcard/sitebox-live.mp4 device-qa/preview-live.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SiteBox-device-qa
          path: |
            device-qa/
            device-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SiteBox-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SOURCE_COMMIT.txt
            app/build/outputs/apk/debug/SHA256SUMS.txt
            app/build/outputs/apk/preview/app-preview.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/reports/lint-results-debug.html
