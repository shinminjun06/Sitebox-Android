name: Import SiteBox image
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  import-image:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[sitebox-image]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and validate image
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.request, urllib.parse, pathlib
          body=os.environ.get('ISSUE_BODY','').strip()
          url=body.splitlines()[0].strip() if body else ''
          parsed=urllib.parse.urlparse(url)
          if parsed.scheme != 'https' or not parsed.hostname:
              raise SystemExit('First line must be a public HTTPS image URL')
          if parsed.hostname in ('localhost',) or parsed.hostname.endswith(('.local','.internal')):
              raise SystemExit('Invalid image host')
          target=pathlib.Path('app/src/main/assets/school_morning.jpg')
          target.parent.mkdir(parents=True,exist_ok=True)
          request=urllib.request.Request(url,headers={'User-Agent':'SiteBox-image-importer'})
          with urllib.request.urlopen(request,timeout=30) as response:
              data=response.read(12*1024*1024+1)
          if len(data)>12*1024*1024 or not data:
              raise SystemExit('Image missing or exceeds 12 MB')
          if not (data.startswith(b'\xff\xd8\xff') or data.startswith(b'\x89PNG\r\n\x1a\n')):
              raise SystemExit('Only JPG/PNG files supported')
          if data.startswith(b'\x89PNG'):
              from PIL import Image
              from io import BytesIO
              im=Image.open(BytesIO(data)).convert('RGB')
              im.save(target,'JPEG',quality=93,optimize=True)
          else:
              target.write_bytes(data)
          print('Saved',target,'bytes:',target.stat().st_size)
          PY
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/school_morning.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Import school background image"
            git push
          fi
      - name: Close request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --comment "Background image imported successfully."
