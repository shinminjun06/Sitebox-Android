name: Download SiteBox 3.3.0 APK
on:
  push:
    branches: [distribution/sitebox-3.3.0]
    paths:
      - distribution/sitebox-3.3.0/SiteBox-3.3.0.apk
      - distribution/sitebox-3.3.0/SHA256SUMS.txt
      - .github/workflows/download-sitebox.yml
      - scripts/verify_release_ui.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upload-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed installation APK
        working-directory: distribution/sitebox-3.3.0
        run: sha256sum --check SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SiteBox-3.3.0-installable-apk
          path: distribution/sitebox-3.3.0/
          if-no-files-found: error
          retention-days: 90
  release-smoke:
    needs: upload-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Install and launch the actual signed R8 release
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swangle -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot-save
          script: |
            adb shell wm size 720x1560
            adb shell wm density 320
            adb shell cmd overlay enable-exclusive --category com.android.internal.systemui.navbar.threebutton
            adb install distribution/sitebox-3.3.0/SiteBox-3.3.0.apk
            adb shell am start -W -n com.sitebox.app/com.sitebox.app.MainActivity
            adb shell am force-stop com.google.android.apps.nexuslauncher
            python3 scripts/verify_release_ui.py || (mkdir -p release-device-qa; adb exec-out screencap -p > release-device-qa/failure.png; adb logcat -d -s AndroidRuntime:E > release-device-qa/crashes.txt; exit 1)
            mkdir -p release-device-qa
            adb exec-out screencap -p > release-device-qa/release-account-settings.png
            adb shell input keyevent 4
            adb shell input keyevent 4
            adb shell dumpsys gfxinfo com.sitebox.app framestats > release-device-qa/emulator-frame-stats.txt
            adb exec-out screencap -p > release-device-qa/release-room.png
            python3 distribution/sitebox-3.3.0/verify-signed-book.py
            adb logcat -d -s AndroidRuntime:E > release-device-qa/crashes.txt
            grep -q 'PASS shrunk release launch and Google backup settings on Android 15' release-verification.txt
            ! grep -q 'FATAL EXCEPTION' release-device-qa/crashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SiteBox-3.3.0-release-check
          path: |
            release-verification.txt
            release-device-qa/
          retention-days: 90
