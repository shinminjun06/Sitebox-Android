plugins { id 'com.android.application' }
def revision = providers.environmentVariable('GITHUB_SHA').getOrElse(providers.exec { commandLine 'git', 'rev-parse', 'HEAD' }.standardOutput.asText.get().trim())
android {
 namespace 'com.sitebox.app'
 compileSdk 35
 defaultConfig {
  applicationId 'com.sitebox.app'
  manifestPlaceholders = [appLabel: 'SiteBox']
  minSdk 24
  targetSdk 35
  testInstrumentationRunner 'com.sitebox.app.SmokeInstrumentation'
  versionCode 4
  versionName '2.2-school'
  buildConfigField 'String', 'SOURCE_REVISION', '"' + revision + '"'
 }
 signingConfigs {
  debug {
   if (System.getenv('SITEBOX_DEBUG_KEYSTORE')) {
    storeFile file(System.getenv('SITEBOX_DEBUG_KEYSTORE'))
    storePassword 'android'
    keyAlias 'androiddebugkey'
    keyPassword 'android'
   }
  }
 }
 buildTypes {
  preview {
   initWith debug
   applicationIdSuffix '.preview'
   versionNameSuffix '-preview'
   manifestPlaceholders = [appLabel: 'SiteBox Preview']
   matchingFallbacks = ['debug']
  }
 }
 buildFeatures { buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 lint { abortOnError true }
}
