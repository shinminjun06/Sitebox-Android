plugins { id 'com.android.application' }
def revision = providers.environmentVariable('GITHUB_SHA').getOrElse(providers.exec { commandLine 'git', 'rev-parse', 'HEAD' }.standardOutput.asText.get().trim())
android {
 namespace 'com.sitebox.app'
 compileSdk 35
 defaultConfig {
  applicationId 'com.sitebox.app'
  minSdk 24
  targetSdk 35
  testInstrumentationRunner 'com.sitebox.app.SmokeInstrumentation'
  versionCode 2
  versionName '2.0-school'
  buildConfigField 'String', 'SOURCE_REVISION', '"' + revision + '"'
 }
 buildFeatures { buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 lint { abortOnError true }
}
